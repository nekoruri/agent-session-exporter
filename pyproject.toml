[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-session-exporter"
version = "0.1.0"
description = "Archive Codex and Claude sessions into an Obsidian Vault."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Masa" },
]
dependencies = ["detect-secrets==1.5.0"]

[project.scripts]
agent-session-exporter = "agent_session_exporter.cli:main"
ase = "agent_session_exporter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_session_exporter"]
