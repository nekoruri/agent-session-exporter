vault_path = "/absolute/path/to/Obsidian/Vault"
destination = "inbox/ai-sessions"
device_id = "my-device"
redact = true
include_tool_details = false
sync_on_capture = true

[collector]
url = ""
token_env = "AGENT_SESSION_EXPORTER_TOKEN"
timeout_seconds = 3.0

[server]
listen = "127.0.0.1"
port = 8765
token_env = "AGENT_SESSION_EXPORTER_TOKEN"

